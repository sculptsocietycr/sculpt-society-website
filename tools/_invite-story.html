<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Invite Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  :root { --orange:#E7552C; --wine:#811D16; --pink:#F4BABB; --cream:#F9F5ED; --gold:#D6C774; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--wine);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
  body{position:relative;color:var(--cream);display:flex;flex-direction:column}
  .photo-area{position:relative;width:100%;height:880px;overflow:hidden;flex-shrink:0}
  .photo-area img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
  .photo-area::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(129,29,22,.25) 0%,rgba(129,29,22,.55) 70%,var(--wine) 100%)}
  .frame{position:absolute;inset:50px;border:1px solid rgba(249,245,237,.18);border-radius:8px;pointer-events:none;z-index:3}
  .spark{position:absolute;color:var(--gold);z-index:2}
  .s1{top:80px;right:130px;font-size:46px}
  .s2{top:740px;left:120px;font-size:30px;opacity:.7}
  .s3{bottom:560px;right:120px;font-size:34px;opacity:.6}
  .s4{bottom:120px;right:130px;font-size:42px}
  .top-meta{position:absolute;top:130px;left:0;right:0;display:flex;justify-content:center;z-index:3}
  .logo{width:104px;height:104px;border-radius:22px;overflow:hidden;border:2px solid rgba(249,245,237,.25)}
  .logo img{width:100%;height:100%;object-fit:cover}
  .body-area{flex:1;padding:60px 90px 100px;display:flex;flex-direction:column;position:relative;z-index:2}
  .eyebrow{color:var(--gold);font-size:18px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;text-align:center}
  .title{margin-top:24px;text-align:center}
  .title .l1{font-size:84px;font-weight:600;line-height:1;letter-spacing:-.04em;color:var(--cream)}
  .title .l2{font-size:84px;font-weight:500;line-height:1;letter-spacing:-.04em;color:var(--pink);font-style:italic;margin-top:6px}
  .tagline{margin-top:30px;font-style:italic;color:var(--gold);font-size:24px;line-height:1.45;text-align:center;max-width:780px;margin-left:auto;margin-right:auto;font-weight:300}
  .date{margin-top:48px;display:flex;align-items:flex-end;justify-content:center;gap:20px}
  .date .num{font-size:200px;font-weight:700;line-height:.85;color:var(--gold);letter-spacing:-.06em}
  .date .meta{padding-bottom:20px}
  .date .meta .month{font-size:42px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .date .meta .year{font-size:18px;color:rgba(249,245,237,.6);letter-spacing:.25em;margin-top:6px}
  .info{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:24px 60px;border-top:1px solid rgba(249,245,237,.18);padding-top:32px;text-align:center}
  .info .label{font-size:14px;letter-spacing:.25em;text-transform:uppercase;color:rgba(249,245,237,.55);margin-bottom:8px}
  .info .v{font-size:24px;font-weight:500;color:var(--cream);line-height:1.3}
  .cta{margin-top:auto;padding-top:28px;border-top:1px solid rgba(249,245,237,.18);display:flex;justify-content:space-between;align-items:center;color:rgba(249,245,237,.7);font-size:18px;letter-spacing:.2em;text-transform:uppercase}
  .cta .domain{color:var(--gold)}
</style>
</head>
<body>
  <div class="photo-area">
    <img src="src/assets/images/about.jpg" alt="" />
  </div>
  <div class="top-meta">
    <div class="logo"><img src="src/assets/logos/logo-instagram.jpg" alt="" /></div>
  </div>
  <span class="spark s1">✦</span>
  <span class="spark s2">✦</span>
  <span class="spark s3">✦</span>
  <span class="spark s4">✦</span>
  <div class="body-area">
    <p class="eyebrow">Próximo evento</p>
    <div class="title">
      <div class="l1">Sculpt Society</div>
      <div class="l2">Hannah Montana Edition</div>
    </div>
    <p class="tagline">Una mañana para moverte, conectar, brillar y vivir lo mejor de ambos mundos ✦</p>
    <div class="date">
      <div class="num">13</div>
      <div class="meta"><div class="month">Junio</div><div class="year">2026</div></div>
    </div>
    <div class="info">
      <div><div class="label">Hora</div><div class="v">10:00 a.m.</div></div>
      <div><div class="label">Inversión</div><div class="v">₡20.000</div></div>
      <div><div class="label">Lugar</div><div class="v">Paloma Studios · Escazú</div></div>
      <div><div class="label">Incluye</div><div class="v">Yoga Sculpt · Brunch · Bedazzling</div></div>
    </div>
    <div class="cta"><span>Inscripciones</span><span class="domain">sculptsocietycr.com</span></div>
  </div>
  <div class="frame"></div>
</body>
</html>
